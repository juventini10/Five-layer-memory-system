name: Validate Memory System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check top-level files
      run: |
        echo "=== Required top-level files ==="
        for file in README.md CHANGELOG.md CONTRIBUTING.md LICENSE .gitignore INSTALL.md version.md; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done

    - name: Check package payload structure
      run: |
        echo "=== Required directories ==="
        for dir in references references/skills references/steps references/templates; do
          if [ -d "$dir" ]; then
            echo "✅ $dir exists"
          else
            echo "❌ $dir missing"
            exit 1
          fi
        done

        echo ""
        echo "=== The 9 linked Skills ==="
        for sk in awaken-memory-system shall-we-talk meta-aletheia daily-buddy growth-box system-logger triwich reading-assistant clock-loop; do
          if [ -f "references/skills/$sk/SKILL.md" ]; then
            echo "✅ $sk"
          else
            echo "❌ references/skills/$sk/SKILL.md missing"
            exit 1
          fi
        done

        echo ""
        echo "=== Install steps (step1–step7 + step6.5) ==="
        step_count=$(find references/steps -name "*.md" | wc -l | tr -d ' ')
        echo "Found $step_count step files"
        [ "$step_count" -ge 8 ] || { echo "❌ expected >= 8 step files"; exit 1; }

    - name: Hygiene — no personal identifiers or cruft
      run: |
        echo "=== No author-specific absolute paths ==="
        # Build the needle from parts so this workflow file never contains the
        # literal path itself (otherwise the check would match its own source).
        OWNER="juventini10"
        if grep -rn "/Users/$OWNER" . --exclude-dir=.git >/dev/null 2>&1; then
          echo "❌ found author home path in shipped content"
          exit 1
        fi
        echo "✅ no author absolute path"

        echo "=== No OS/runtime cruft committed ==="
        if find . -path ./.git -prune -o \( -name '.DS_Store' -o -name '*.bak' -o -name '.phaseX_last_run.json' \) -print | grep -q .; then
          echo "❌ found .DS_Store / .bak / .phaseX_last_run.json"
          exit 1
        fi
        echo "✅ clean"

    - name: Version consistency
      run: |
        echo "=== version.md ==="
        cat version.md
        grep -q 'version:' version.md || { echo "❌ version.md has no version field"; exit 1; }

    - name: Summary
      run: |
        echo ""
        echo "=========================================="
        echo "✅ All validation checks passed!"
        echo "=========================================="
        echo "  - Total files: $(find . -path ./.git -prune -o -type f -print | wc -l)"
        echo "  - Skills: $(find references/skills -maxdepth 1 -type d | tail -n +2 | wc -l)"
        echo "  - README.md size: $(wc -l < README.md) lines"

  # ── Real Windows machine guard ─────────────────────────────────────────────
  # The package ships PowerShell scripts (restore-my-skills.ps1, rollback.ps1)
  # containing Chinese text. Without a UTF-8 BOM, PowerShell 5.1 on a zh-CN
  # system reads them as GBK and crashes. This job runs on a REAL windows-latest
  # runner to assert the BOM and prove every .ps1 is syntactically loadable.
  windows-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: PowerShell 5.1 — BOM + parse guard (real Windows machine)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fail = 0
          $ps1 = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          if ($ps1.Count -eq 0) { Write-Host "warning: no .ps1 found"; exit 0 }
          foreach ($f in $ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
            $rel = $f.FullName.Replace($PWD.Path + '\', '')
            if (-not $hasBom) {
              Write-Host "FAIL: $rel - missing UTF-8 BOM (PS5.1 would parse Chinese as GBK -> crash)"
              $fail++
              continue
            }
            $code = [System.IO.File]::ReadAllText($f.FullName)
            try { [void][ScriptBlock]::Create($code) }
            catch {
              Write-Host "FAIL: $rel - PowerShell parse error: $_"
              $fail++
              continue
            }
            Write-Host "PASS: $rel - UTF-8 BOM present + parses cleanly"
          }
          if ($fail -gt 0) { exit 1 }
          Write-Host "All .ps1 files passed the Windows real-machine guard."

      - name: Real install-path test (references/skills is authoritative)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $PWD.Path
          # 1) orphan guard — top-level skills/ was deleted, install must use references/skills/
          if (Test-Path "$repo\skills") { Write-Host "FAIL: orphan skills/ still present"; exit 1 }
          Write-Host "PASS: no orphan top-level skills/ dir"
          # 2) install copy test from references/skills/
          $targetRoot = Join-Path $env:TEMP "wb_skills_test"
          if (Test-Path $targetRoot) { Remove-Item $targetRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $targetRoot | Out-Null
          $skills = @('daily-buddy','clock-loop','triwich')
          foreach ($sk in $skills) {
            $src = Join-Path $repo "references\skills\$sk"
            if (-not (Test-Path $src)) { Write-Host "FAIL: references/skills/$sk missing"; exit 1 }
            $dst = Join-Path $targetRoot $sk
            New-Item -ItemType Directory -Path $dst -Force | Out-Null
            Copy-Item -Path "$src\*" -Destination "$dst\" -Recurse -Force
            $skillMd = Join-Path $dst "SKILL.md"
            if (-not (Test-Path $skillMd)) { Write-Host "FAIL: $sk SKILL.md missing after copy"; exit 1 }
            Write-Host "PASS: installed $sk (SKILL.md present)"
            # 3) junction test (WorkBuddy soft-link convention, no admin needed)
            $link = Join-Path $targetRoot "${sk}-link"
            if (Test-Path $link) { Remove-Item $link -Force }
            New-Item -ItemType Junction -Path $link -Target $src | Out-Null
            if (-not (Test-Path (Join-Path $link "SKILL.md"))) { Write-Host "FAIL: junction $sk not resolving"; exit 1 }
            Write-Host "PASS: junction $sk -> references/skills/$sk resolves"
          }
          Write-Host "All real Windows install-path tests passed."
