# WorkBuddy 能力矩阵（v2.0 合并包·2026-09-23 补声明·发布面地基对称）
# 背景：WB=install_scripts.py 默认分支（无 --platform 即本端），历史上无声明文件
# → T17 误列"待迁入"。本 yaml 补对称，能力值全部取自本包实证（行号=install_scripts.py）。
platform: workbuddy
display_name: "WorkBuddy"
emoji: "⚡"
config_root: "~/.workbuddy"
capabilities:
  rules_inject: true         # .mdc rules alwaysApply 常驻（计划文档§三架构图 workbuddy 行）
  agents_full_inject: true   # CAPABILITY-MATRIX.md WB 列 AGENTS=✅
  hooks_event: true          # ROSTER 19钩子·4事件全活（L51-69 实读：UPS/PreToolUse/SessionStart/Stop）
  hook_stdout_inject: true   # UserPromptSubmit route/rule/guard 五件注册于 ROSTER 头部
  settings_json: true        # ~/.workbuddy/settings.json 注册面（L42 SETTINGS 常量）
  awareness: true            # settings.json hooks + awareness + .mdc rules（§三架构图原文）
  skill_symlink: true        # ~/.workbuddy/skills/ 软链（win-verify V11 判据在管）
  custom_directive: true     # SOUL/IDENTITY/USER 落 ~/.workbuddy/（step5 契约·V12 判据）
  # 2026-10-03 实测（隔离干净机 verdict=failed 定案）：本端 <cfg_root>/plugins/ 是
  #   **端应用自建**目录（cache · marketplaces · installed_plugins.json），
  #   ⛔ 本包安装器从不装它 ⇒ 回执不得要求它存在（否则新用户装完即判 failed）
  plugins_delivered: false
hooks_ssot: "[记忆共享中心]/记忆蓝图/04_系统文件设计/布洛陀脚本架构设计哲学/01-脚本架构设计通用规范.md#二·七"

# ─── 条文33扩展 · 装机基线对称（2026-10-06 你令"按符合愿景的最优解处理"裁决落地）──
# guard_baseline_seed=py → 安装器 write_guard_baseline 装机期按 deploy_hooks 全量推导
# 写 hook_baseline.json（期望事件面="该装什么"·非注册回声·GIGO闸保证包缺件时不写）。
# 此前未声明=端用户装机无自检基线（QCN/lobsterai 等端有）⇒ 对称性补齐：
# 端用户装完即可机械对账 settings.json 实挂 vs 期望面，闭环不依赖人记得。
guard_baseline_seed: py

# ─── 条文32 · 五系统文件端自适配声明（2026-10-03 补·口径=五件逐件有本端载体）──
# 五件口径（SSOT=WorkBuddy布洛陀设计哲学/02-三层分离与系统文件映射规范 §六）：
#   SOUL / IDENTITY / USER / MEMORY / 自定义指令（customPrompt 等价物）·⛔SHADOW 不算（L5 投影进 USER.md 的段）
#
# 本端形态（2026-10-03 实测·非凭印象）：
#   四件 md 落配置根（扁平结构）；自定义指令⛔不是独立文件——
#   是 WorkBuddy 设置框的 JSON 字段 ⇒ 用「路径::字段」形态声明（verify §1.5 支持该形态走字段级核验）。
#   ⚠️ 别端别形态（对照）：zcode 五件全并入 AGENTS.md（单通道合一）· doubaowork 落 ~/.doubaowork-config/ 靠粘贴。
#   ⇒ 五件是五件，**各端按自身特性适配**，⛔ 不共用一套落点。
system_file_paths:
  # C29 键名归一（2026-10-15）：裸名键→条文32 五键。key 是协议（三读者同源），value 是端形态（一字未改）
  SOUL.md: "SOUL.md"                                    # → ~/.workbuddy/SOUL.md（实测 6662 bytes）
  IDENTITY.md: "IDENTITY.md"                            # → ~/.workbuddy/IDENTITY.md（实测 452 bytes）
  USER.md: "USER.md"                                    # → ~/.workbuddy/USER.md（实测 16673 bytes）
  MEMORY.md: "MEMORY.md"                                # → ~/.workbuddy/MEMORY.md（实测 6520 bytes）
  自定义指令: "app/app-config.json::personalization.customPrompt"   # 设置框字段（实测 1338 chars·⛔非 md·装机器解析 :: 不整写宿主文件）

# 五件模板来源（2026-10-03）：**公共模板 + 端名注入**——不是没做端适配
#   本端是扁平配置根（~/.workbuddy/），五件原样用 references/templates/ 公共模板，
#   合成时按本文件 display_name=WorkBuddy / emoji=⚡ 注入端名与署名格式
#   （落点见 step5-file-synthesis.md「端名注入（G2-2 走查缺陷修·ID-5）」）。
#   ⛔ 不另建 adapters/workbuddy/templates/ 复制一份——那是第二本账·端名注入做同一件事。
system_file_tpl_mode: shared

# ─── 条文33 · 端侧功能面映射声明（2026-10-03 补）──
# 三态判据：delivered=机械交付（装完即得）｜endogenous=端自带｜gap=实盘在挂而包无承载。
hooks_surface:
