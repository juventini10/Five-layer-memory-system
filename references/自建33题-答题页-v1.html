const SCHEMA_V="v2"; // P07(2026-10-19)：schema 版本——题库结构改版时升此号，旧键自然隔离
const KEY="blt33_answers_"+SCHEMA_V+"_"+location.pathname.replace(/[^\w]/g,"_").slice(-48); // P07：路径隔离键，跨包/跨沙箱不互灌
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){store={};}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function render(){
  const box=document.getElementById("qs");
  box.innerHTML=Q.map(d=>{
    const t=d.open?"open":(d.multi?"multi":"single");
    let inner="";
    if(t==="open"){
      inner=`<textarea data-q="${d.id}" data-t="open" placeholder="写下你的答案……"></textarea>`;
    }else{
      inner=d.opts.map(o=>{
        const isOther=/其他/.test(o.v);
        const inp=t==="multi"
          ?`<input type="checkbox" name="q${d.id}" value="${o.k}" data-q="${d.id}" data-t="multi">`
          :`<input type="radio" name="q${d.id}" value="${o.k}" data-q="${d.id}" data-t="single">`;
        return `<label class="opt">${inp}${esc(o.k)} ${esc(o.v)}</label>`
          +(isOther?`<div class="otherbox" data-for="${d.id}-${o.k}"><input placeholder="写下你的其他答案" data-other="${d.id}-${o.k}"></div>`:"");
      }).join("");
    }
    const tag=t==="multi"?'<span class="tag">可多选</span>':(t==="open"?'<span class="tag">开放填写</span>':"");
    return `<div class="q" id="qb${d.id}"><h3>Q${d.id}. ${esc(d.q)}${tag}</h3>${inner}</div>`;
  }).join("");
  bind();
  restore();
  update();
}
function bind(){
  document.querySelectorAll("input[data-q]").forEach(el=>{
    el.addEventListener("change",()=>{save();update();toggleOther(el);});
  });
  document.querySelectorAll("textarea[data-q]").forEach(el=>{
    el.addEventListener("input",()=>{save();update();});
  });
  document.querySelectorAll("input[data-other]").forEach(el=>{
    el.addEventListener("input",()=>{save();update();});
  });
}
function toggleOther(el){
  // 选中含"其他"的选项时显示填空框（单选组内取消互斥项的框）
  const d=Q.find(x=>x.id==el.dataset.q);
  d.opts.forEach(o=>{
    if(!/其他/.test(o.v))return;
    const bx=document.querySelector(`.otherbox[data-for="${d.id}-${o.k}"]`);
    if(!bx)return;
    const checked=el.value===o.k && el.checked;
    bx.classList.toggle("show",!!checked);
  });
}
function collect(){
  const out={};
  Q.forEach(d=>{
    if(d.open){
      const ta=document.querySelector(`textarea[data-q="${d.id}"]`);
      const v=(ta.value||"").trim();
      if(v)out[d.id]={t:"open",text:v};
    }else if(d.multi){
      const cs=[...document.querySelectorAll(`input[data-q="${d.id}"]:checked`)].map(c=>c.value);
      if(cs.length)out[d.id]={t:"multi",keys:cs};
    }else{
      const c=document.querySelector(`input[data-q="${d.id}"]:checked`);
      if(c)out[d.id]={t:"single",key:c.value};
    }
    const ob=document.querySelector(`.otherbox[data-for="${d.id}-"] , input[data-other="${d.id}-"]`);
    [...document.querySelectorAll(`input[data-other^="${d.id}-"]`)].forEach(ip=>{
      const val=(ip.value||"").trim();
      if(val&&out[d.id])out[d.id].other_text=(out[d.id].other_text?out[d.id].other_text+"；":"")+val;
    });
  });
  return out;
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(collect()));
  const s=document.getElementById("saved");
  s.textContent="已自动保存 "+new Date().toTimeString().slice(0,8);
}
function restore(){
  if(Object.keys(store).length){ // P07②：回填必显式提示——防"以为包自带答案"
    const bt=document.createElement("div");bt.style.cssText="text-align:center;padding:8px;color:#8a6d1b;background:#fff8dc";
    bt.textContent="⚠️ 本页正从本浏览器上次暂存回填进度（localStorage）——这不是安装包自带的答案。可继续作答，或点下方「清空进度重答」。";
    document.body.insertBefore(bt,document.body.firstChild);
    const clr=document.createElement("button");clr.textContent="清空进度重答";clr.style.cssText="display:block;margin:6px auto;padding:6px 14px";
    clr.onclick=()=>{if(confirm("确定清空本浏览器暂存的作答进度？")){localStorage.removeItem(KEY);location.reload();}};
    document.body.insertBefore(clr,bt.nextSibling);
  }
  Object.entries(store).forEach(([id,v])=>{
    if(v.t==="open"){const ta=document.querySelector(`textarea[data-q="${id}"]`);if(ta)ta.value=v.text;}
    else if(v.t==="multi"){v.keys.forEach(k=>{const c=document.querySelector(`input[data-q="${id}"][value="${k}"]`);if(c){c.checked=true;toggleOther(c);}});}
    else if(v.t==="single"){const c=document.querySelector(`input[data-q="${id}"][value="${v.key}"]`);if(c){c.checked=true;toggleOther(c);}}
    if(v.other_text){const ip=document.querySelector(`input[data-other^="${id}-"]`);if(ip)ip.value=v.other_text;}
  });
}
function update(){
  const a=collect();
  const done=Object.keys(a).length;
  document.getElementById("prog").textContent=done+" / 33";
  document.getElementById("barfill").style.width=(done/33*100)+"%";
  const missing=Q.filter(d=>!(d.id in a)).map(d=>d.id);
  document.getElementById("misshint").innerHTML=missing.length?`<span class="miss">还有 ${missing.length} 题未答：Q${missing.join(", Q")}</span>`:"";
  document.getElementById("btn").disabled=missing.length>0;
  if(missing.length===0&&document.getElementById("result").style.display==="block")gen();
}
function gen(){
  const a=collect();
  const payload={
    kind:"布洛陀33题答卷",
    schema:"blt33-v1",
    source:"自建33题-答题页-v1.html",
    answered_at:_nowLocalStr(),  // C10：本机墙钟（旧 UTC toISOString 使早于08:00的答卷落前一天日期）
    answers:Q.map(d=>{
      const v=a[d.id]||{};
      const item={id:d.id,question:d.q,type:v.t||"missing"};
      if(v.t==="open")item.text=v.text;
      else if(v.t==="multi")item.keys=v.keys;
      else if(v.t==="single")item.key=v.key;
      if(v.other_text)item.other_text=v.other_text;
      if(d.opts&&d.opts.length)item.options=d.opts.map(o=>o.k+" "+o.v);
      return item;
    })
  };
  document.getElementById("json").value=JSON.stringify(payload,null,1);
  document.getElementById("result").style.display="block";
}
document.getElementById("btn").addEventListener("click",async()=>{gen();document.getElementById("result").scrollIntoView();
  const ta=document.getElementById("json");
  try{await navigator.clipboard.writeText(ta.value);document.getElementById("copyhint").textContent="已自动复制 ✓ 回到 AI 对话窗口直接粘贴即可，剩下的它自己会做";}catch(e){document.getElementById("copyhint").textContent="请点下方「复制结果」按钮，回 AI 对话窗口粘贴，剩下的它自己会做";}});
document.getElementById("copy").addEventListener("click",async()=>{
  const ta=document.getElementById("json");
  try{await navigator.clipboard.writeText(ta.value);}catch(e){ta.select();document.execCommand("copy");}
  document.getElementById("copy").textContent="已复制 ✓";
});
document.getElementById("dl").addEventListener("click",()=>{
  const b=new Blob([document.getElementById("json").value],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="问卷答案-"+_todayLocal()+".json";a.click();
});
render();
</script>
</body>
