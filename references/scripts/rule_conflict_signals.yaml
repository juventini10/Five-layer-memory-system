# rule_conflict_signals.yaml — 冲突/边缘信号触发规格（独立真源）
#
# 2026-09-16 从 rule_fragment_inject.py 硬编码迁入治理（三明智 L2 键 20260916_195826·B闸）。
# 迁入目的：正则 match 纳入语料迭代闭环——漏检样本回灌本文件=自进化（愿景③）；
# 独立于 rule_triggers.yaml（那是铁律 22 条·受 guard ⑥ 的 22==22 校验辖区，勿混）。
# 消费者：rule_triggers_loader.load_conflict_signals() → rule_fragment_inject（fallback=内置默认组）。
# 迭代纪律（铁律-020）：扩 match 前 dry-run（rule_fragment_eval 跑分）·语料正负例同步扩·误触发即回撤。
version: 1
source: "冲突/边缘信号触发规格·v1 扩面（2026-09-16 迁入+自然变体扩面）"
signals:
  - id: "CS-01"
    name: 规则冲突
    match:
      - "规则冲突|冲突.*规则|这两条规则|规则.*矛盾|规则打架|规则.*抵触"
  - id: "CS-02"
    name: 修改规则
    match:
      - "改.*规则|修改.*这条规则|这条规则.*改|调整.*规则|规则.*能不能改|规则.*如何改"
  - id: "CS-03"
    name: 边缘情况
    match:
      - "边缘情况|边缘场景|边界情况|边界场景|特殊情况|异常情形"
  - id: "CS-04"
    name: 规则依据追问
    match:
      - "为什么.*规则|规则.*为什么|规则.*依据|规则.*这样定|规则.* rationale"
  - id: "CS-05"
    name: 晋升复查
    match:
      - "成长箱.*晋升|晋升.*复查|晋升复查|晋升.*评估"
  - id: "CS-06"
    name: 铁律编号冲突变体（2026-09-16 扩面·实测'打架'漏检回灌）
    match:
      - "铁律.*打架|规则.*打架|打架.*铁律|打架.*规则|0\\d\\d.*打架"
      - "0\\d\\d.*(优先|矛盾|抵触|为准)|(优先|矛盾|抵触|为准).*0\\d\\d"
      - "哪条.*(优先|管用|大)|谁听谁|以哪条为准|听哪条"
      - "铁律.*说不通|规则.*说不通|两条.*(铁律|规则).*(矛盾|冲突)"
