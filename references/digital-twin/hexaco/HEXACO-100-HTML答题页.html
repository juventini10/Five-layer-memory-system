<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEXACO-100 自陈问卷 · 官方中文版</title>
<style>
  :root { --ink:#1a1a2e; --muted:#666; --line:#e3e3ea; --accent:#3f5efb; --ok:#1a9c6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#f7f7fb; padding-bottom:120px; }
  header { position:sticky; top:0; background:#fff; border-bottom:1px solid var(--line); padding:14px 18px; z-index:10; }
  header h1 { font-size:18px; }
  header .scale { font-size:12px; color:var(--muted); margin-top:4px; }
  #bar { height:6px; background:#eee; border-radius:3px; margin-top:10px; overflow:hidden; }
  #fill { height:100%; width:0%; background:var(--accent); transition:width .2s; }
  #count { font-size:13px; margin-top:6px; color:var(--muted); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .note { background:#eef1ff; border-radius:10px; padding:12px 14px; font-size:13px; line-height:1.7; margin-bottom:16px; }
  .item { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .item.unanswered { border-left:4px solid #e0b400; }
  .item.answered { border-left:4px solid var(--ok); }
  .item .no { font-size:12px; color:var(--muted); }
  .item .q { font-size:15px; line-height:1.6; margin:4px 0 10px; }
  .opts { display:flex; gap:6px; }
  .opts label { flex:1; text-align:center; border:1.5px solid var(--line); border-radius:8px; padding:8px 0; cursor:pointer; font-size:13px; color:var(--muted); user-select:none; }
  .opts input { display:none; }
  .opts input:checked + span { color:#fff; }
  .opts label:has(input:checked) { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); padding:12px 18px; text-align:center; }
  #submit { background:var(--accent); color:#fff; border:none; font-size:16px; padding:12px 40px; border-radius:10px; cursor:pointer; }
  #submit:disabled { background:#aaa; cursor:not-allowed; }
  #result { display:none; max-width:760px; margin:20px auto; padding:16px; background:#fff; border:1px solid var(--line); border-radius:12px; }
  #result h2 { font-size:16px; margin-bottom:10px; }
  #out { width:100%; height:120px; font-family:monospace; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .btnrow { margin-top:10px; display:flex; gap:10px; justify-content:center; }
  .btnrow button { padding:9px 18px; border-radius:8px; border:1px solid var(--accent); background:#fff; color:var(--accent); cursor:pointer; font-size:14px; }
  .btnrow button.primary { background:var(--accent); color:#fff; }
  #warn { color:#c0392b; font-size:13px; margin-top:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>HEXACO-100 · 自陈问卷（官方中文版）</h1>
  <div class="scale">1 = 极不同意 · 2 = 不大同意 · 3 = 没意见 · 4 = 基本同意 · 5 = 非常同意</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="count">已答 0 / 100</div>
</header>
<main>
  <div class="note">
    <b>答题指导（官方）：</b>下面是关于人们日常行为与想法的描述，凭<b>第一反应</b>作答，答案没有对错，<b>请勿漏答</b>。<br>
    答案自动保存在本浏览器（关页面不丢）。全部答完后点底部「生成结果」。
  </div>
  <div id="list"></div>
</main>
<footer>
  <button id="submit">生成结果</button>
  <div id="warn"></div>
</footer>
<div id="result">
  <h2>✅ 完成。把下面结果串复制发给 ZCode（或点「下载答案文件」后告诉它「答完了」）</h2>
  <textarea id="out" readonly></textarea>
  <div class="btnrow">
    <button class="primary" onclick="copyOut()">复制结果串</button>
    <button onclick="downloadAnswers()">下载答案文件</button>
  </div>
</div>
<script>
const ITEMS = {"1": "我觉得参观美术馆很无聊。", "2": "我经常清理自己的办公室或居家环境。", "3": "我很少有怨恨，即使面对那些对我很坏的人。", "4": "整体而言我对自己还算满意。", "5": "如果我必须在恶劣气候之下出行，我会感到害怕。", "6": "为了从自己不喜欢的人手中得到一些东西, 我会假装对那个人很友善。", "7": "我喜欢去学习外国的历史和政治。", "8": "当工作时, 我通常会为自己订下规模宏大的目标。", "9": "有时候其他人告诉我，我对别人太挑剔。", "10": "在团体讨论中，我很少表达自己的意见。", "11": "在一些时候，我会不由自主的为一些小事而感到焦躁不安。", "12": "如果知道我自己永远不会被抓，我会想要通过盗窃的方式获得一百万元人民币。", "13": "我喜欢做遵照惯例、简单重复的工作，而不是需要创意的工作。", "14": "为了找出任何可能的错误，我会反复检查自己的工作。", "15": "有时候其他人认为我太顽固。", "16": "我常常会避免跟其他人闲聊。", "17": "当我遭遇到痛苦的经验时，我需要其他人的安慰。", "18": "对我来说，拥有很多金钱不是特别重要。", "19": "我认为听取别人的极端意见是在浪费时间。", "20": "我在做决定的时候常常依赖自己当时的感受，而不会去仔细思考和比较得失。", "21": "别人认为我是一个很暴躁的人。", "22": "几乎所有时候我都精力充沛。", "23": "看到别人哭时，我也会想哭。", "24": "我认为自己是个普普通通的人，并不比其他人优秀。", "25": "我不愿花时间去阅读诗集。", "26": "我会在事前计划和组织要做的事，避免最后一分钟手忙脚乱。", "27": "面对那些对我很坏的人，我的态度通常是“原谅与忘记”。", "28": "我认为大多数人喜爱我的某些个性。", "29": "我不介意去做一些有危险性的工作。", "30": "即使我相信用巴结的方式可以得到奖励，我也不会这么做。", "31": "我喜欢看不同地方的地图。", "32": "为了达到目标，我通常把自己逼得很紧。", "33": "我通常会接受别人所犯的错误，而不会抱怨他们。", "34": "在社交场合里, 我通常都是那个先主动搭讪的人。", "35": "比起大多数人，我担心的事少了很多。", "36": "如果手头很紧, 我可能会禁不起诱惑去购买赃物。", "37": "我喜欢从事艺术创作，例如，写小说、写歌、绘画。", "38": "做事时, 我往往不太注意小细节。", "39": "当别人不同意我的时候,我通常能让自己的意见保持相当的弹性。", "40": "我喜欢一群人聚在一起闲聊。", "41": "我可以面对困难的处境而不需要任何人的情感支持。", "42": "我希望能够住在一个很昂贵而且很高级的社区。", "43": "我喜欢那些对事情有独特见解的人。", "44": "我因采取行动前没有仔细思考而犯下很多错误。", "45": "即使别人对待我很差，我也很少生气。", "46": "大多数日子里, 我都感到愉快和乐观。", "47": "当与我很亲近的人不开心的时候，我往往会感同身受。", "48": "我不想要别人对待我的方式好像我比他们优秀。", "49": "如果我有机会, 我会想去参加古典音乐会。", "50": "别人时常取笑我房间或桌子凌乱。", "51": "如果有人欺骗过我一次, 我以后都会怀疑这人。", "52": "我觉得自己是个不受欢迎的人。", "53": "面对可能使身体受伤的险境, 我会很害怕。", "54": "如果我想从某人手中得到一些东西, 即使那个人讲的笑话再不好笑，我也会哈哈大笑。", "55": "我觉得关于科学史和科技史的书都很无趣。", "56": "我为自己定下的目标，常常最后未完成就放弃。", "57": "我会用宽厚的态度去评论他人。", "58": "在团体中，我常是那个代表团体说话的人。", "59": "我很少因为压力或忧虑而失眠。", "60": "即使很有价值或金额很大，我也绝不会接受贿赂。", "61": "别人经常说我有很好的想象力。", "62": "为了在工作上精益求精，我会不惜花费很多时间。", "63": "当别人说我错了的时候，通常我的第一个反应就是跟他们争辩。", "64": "相比较于只需独自一人进行的工作，我更喜欢需要积极与别人互动的工作", "65": "每当我忧心某些事，我总想跟别人说说自己的忧虑。", "66": "我想让别人看到我开着名贵的轿车。", "67": "我认为自己算是个不墨守成规的人。", "68": "我不会因为冲动而做出不理智的行为。", "69": "大多数的人比我容易生气。", "70": "别人常常对我说，我应该试着快乐起来。", "71": "当亲近的人要离开一段很长的时间，我会有很深的感伤。", "72": "我认为我比一般人更有资格得到更多尊重。", "73": "有时候我喜欢静静地看着风吹过树稍。", "74": "在工作上, 我有时候会因为没有事先进行很好的计划而遇到困难。", "75": "我发觉很难完全原谅曾对我刻薄的人。", "76": "我有时会觉得自已一文不值。", "77": "即使面对危急情况, 我不会感觉到惊慌。", "78": "我不会为了让某人帮我做事而假装喜欢那个人。", "79": "翻阅百科全书这件事，我从没真正喜欢过。", "80": "我只做每天应做的最少工作量。", "81": "即使在别人犯了很多错误的时候, 我也很少说难听的话。", "82": "在一群人面前说话, 我会感到非常不自然。", "83": "在等待一些重大决定的结果时，我会变得非常焦躁。", "84": "如果我确定绝不会被抓到，我会禁不住诱惑使用伪钞。", "85": "我不认为自己是那种有艺术天份或创意的人。", "86": "别人常说我是个完美主义者。", "87": "当我坚信自己是正确的时候，我发觉自己很难去跟人妥协。", "88": "通常我到新环境做的第一件事就是交新朋友。", "89": "我很少跟别人讨论自己的问题。", "90": "如果有机会可以拥有昂贵的奢侈品，我会获得很大的快乐。", "91": "我发觉讨论哲学很乏味。", "92": "我喜欢想到什么就做什么，不喜欢按计划行事。", "93": "当有人侮辱我时，我发觉很难去控制自己的脾气。", "94": "大多数人都比平常的我要更乐观和更有活力。", "95": "即使在会让大多数人变得很感伤的情境中，我仍可不动情感。", "96": "我想让别人知道我是个地位高的重要人物。", "97": "我会同情那些比我不幸的人。", "98": "我会慷慨地为那些有需要的人提供帮助。", "99": "我不会因为伤害了自己不喜欢的人而感到不安或愧疚。", "100": "别人觉得我是个硬心肠的人。"};
const KEY = 'hexaco100_answers_v1';
let answers = JSON.parse(localStorage.getItem(KEY) || '{}');
const list = document.getElementById('list');
for (const n of Object.keys(ITEMS)) {
  const d = document.createElement('div');
  d.className = 'item'; d.id = 'it' + n;
  d.innerHTML = `<div class="no">第 ${n} 题 / 100</div><div class="q">${ITEMS[n]}</div>
    <div class="opts">${[1,2,3,4,5].map(v =>
      `<label><input type="radio" name="q${n}" value="${v}" ${answers[n]==v?'checked':''}><span>${v}</span></label>`).join('')}</div>`;
  list.appendChild(d);
}
function update() {
  answers = {};
  let done = 0;
  for (const n of Object.keys(ITEMS)) {
    const sel = document.querySelector(`input[name=q${n}]:checked`);
    if (sel) { answers[n] = +sel.value; done++; }
    const it = document.getElementById('it' + n);
    it.className = 'item ' + (sel ? 'answered' : 'unanswered');
  }
  document.getElementById('fill').style.width = done + '%';
  document.getElementById('count').textContent = `已答 ${done} / 100`;
  localStorage.setItem(KEY, JSON.stringify(answers));
  return done;
}
document.addEventListener('change', update);
document.getElementById('submit').onclick = () => {
  const done = update();
  const miss = Object.keys(ITEMS).filter(n => !answers[n]);
  const warn = document.getElementById('warn');
  if (miss.length) {
    warn.style.display = 'block';
    warn.textContent = `还有 ${miss.length} 题未答：第 ${miss.slice(0,15).join('、')}${miss.length>15?'…':''} 题（已高亮黄标）`;
    document.getElementById('it'+miss[0]).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  warn.style.display = 'none';
  const str = Object.keys(ITEMS).map(n => `${n}:${answers[n]}`).join(',');
  document.getElementById('out').value = str;
  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
};
function copyOut() {
  const t = document.getElementById('out');
  t.select(); navigator.clipboard.writeText(t.value).catch(()=>document.execCommand('copy'));
}
function downloadAnswers() {
  const blob = new Blob([JSON.stringify({form:'HEXACO-PI-R-100', lang:'zh-CN-official', date:new Date().toISOString(), answers}, null, 0)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hexaco100_answers.txt';
  a.click();
}
update();
</script>
</body>
</html>
