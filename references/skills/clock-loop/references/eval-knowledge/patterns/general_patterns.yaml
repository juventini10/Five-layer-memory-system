# 通用评估模式库 - v1.0 (2026-09-02)
# 用途: clock-loop 阶段2 对非 Skill 对象(A审核/B生成/C分析/D修复)的多维评分依据
# 来源: 补链loop独立审查 P1#1 根治——原 general_evaluation 降级落点为空,非Skill对象无机检可走
# 权重对齐: current_weights.yaml 的 general 段(content_quality 0.35/structure_clarity 0.25/actionability 0.25/philosophical 0.15)

general_evaluation:
  type_detection:
    rules:
      - type: "content"
        signal: "对象为文案/文章/报告/文档等非SKILL.md产物"
      - type: "analysis"
        signal: "对象为数据/结论/方案等分析产出"
      - type: "fix"
        signal: "对象为代码/配置修复结果"

  dimensions:
    - name: "内容质量"
      weight: 0.35
      check_items:
        - item: "核心诉求全覆盖（对照阶段1确认的checklist逐项）"
        - item: "事实性内容有来源或标注⚠️未验证"
        - item: "无自相矛盾表述"
        - item: "无占位符/模板残留"
    - name: "结构清晰度"
      weight: 0.25
      check_items:
        - item: "结构服务读者（结论先行/层级分明）"
        - item: "标题与内容一致"
        - item: "无信息断层（跳步/悬空引用）"
    - name: "可操作性"
      weight: 0.25
      check_items:
        - item: "产出可直接使用（文件落盘/结论可执行）"
        - item: "下一步行动明确"
        - item: "异常路径有说明"
    - name: "哲学评估"
      weight: 0.15
      check_items:
        - item: "价值对齐（不损害使用者利益）"
        - item: "认知边界（不确定性已标注）"
        - item: "意义完整性（为什么做可追溯）"

  scoring_notes: "每维度得分=通过项/总项；哲学≥85%按及格/不及格二值计入（对齐skill路径口径）；审查/封口/收尾门禁流程与skill路径同构"

# ── v1.1(2026-10-08·成长箱C4立案·你批) 新增模式卡 ──
instrument_blindness:
  name: "报告层与数据层失联（仪器盲）"
  status: candidate  # N3复核位=落库后首轮loop抽样≥3条回目标原文实读，过检转正
  signals:
    - "任何『不存在/归零/漂移/断供』类结论仅来自报告层读数（审计表/日志/守卫报警）"
    - "仪器自身读取路径未经验证是否指向其声称的数据源"
  evidence:
    - "2026-08-24 h4-conflict-samples.jsonl 建成0字节而规范声明已纳入反馈源（文档冒充运行·10-08实测显形）"
    - "2026-10-08 confidence_calibration_audit v1.0 连续块纪律遇台账表格行间空行断表，真复核24+真推翻3读成n=0~3，误判飞轮断供"
    - "2026-10-08 rule_three_layer_guard v2.1.3 把e2e scratch测试fixture硬编码为生产BASE，巡缓存对真库全瞎误报漂移"
  detection: "执行仪器读数驱动的修复前，先实读该仪器读取路径常量并验证指向声称对象（三件套：回读真源+注入应命中反例+变异检验）；假红与假绿对称先验尺"
  boundary: "机检只保证『读取路径与声称源一致』；『先验尺』语义判断的正误仍归AI验收+你终审（⛔关键词机检=假绿·参direction_gate诚实边界）"
  source: "成长箱C4决策表2026-10-08你批·联动守卫编写规范§仪器自证『报警文案即行动指令』(v1.2.237)+铁律-031/PAT-073"
