# 读书助手 Skill 配置 (v3.x)
# 最后更新: 2026-07-02

## paths（路径配置）

| 类型 | 路径 | 备注 |
|------|------|------|
| 笔记输出 | `{{OBSIDIAN_VAULT}}/2-知识库/01-读书笔记` | 精华摘要输出路径 |
| 知识池(卡片) | `{{OBSIDIAN_VAULT}}/2-知识库/05-知识池/` | 永久卡片输出路径 |
| 知识池索引 | `{{OBSIDIAN_VAULT}}/2-知识库/05-知识池/INDEX.md` | 索引文件 |
| 电子书目录 | `{{EBOOK_DIR}}/` | 禁止写入 |

## quality_thresholds（质量阈值 · v3.x 知识池架构）

### 5分钟精华

| 指标 | 阈值 |
|------|------|
| 一句话定位 | ≤30字 |
| 核心观点 | 3条，每条≤100字 |
| 立即行动 | 1个，≤50字 |
| 总字数 | ≤300字 |

### 永久卡片

| 指标 | 阈值 |
|------|------|
| 每本书卡片数 | 10-15张 |
| 每张卡片字数 | 100-200字 |
| 最少卡片数 | 10张（非标书籍可降为8） |
| ⛔最多卡片数 | 15张 |

### 题库

| 指标 | 阈值 |
|------|------|
| 默写题 | 3道（检测概念） |
| 应用场景题 | 3道（检测理解） |
| 逻辑链推导题 | 3道（检测深度） |

## 禁止规则

- ⛔ 禁止生成775行旧版11模块笔记（v3.0重构后废除）
- ⛔ 禁止写入 `{{EBOOK_DIR}}/` 下的任何子目录
- ⛔ 禁止使用旧版 reading_status="已读完"（使用三级状态）
- ⛔ 禁止用旧版9模块名（详见SKILL.md禁止行为#1）
