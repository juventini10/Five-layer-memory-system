## quality_thresholds（质量阈值 · v3.x 知识池架构）

### 5分钟精华

| 指标 | 阈值 |
|------|------|
| 一句话定位 | ≤30字 |
| 核心观点 | 3条，每条≤100字 |
| 立即行动 | 1个，≤50字 |
| 总字数 | 由内容涌现·无硬上限（结构完整=⚔️矛盾+🎯3核心观点+⚡1行动 即达标；每元素简洁自然收敛，见上方「核心观点≤100字」等 per-element 微护栏） |

### source_type 分档表（v4.0.0 新增 · 方案§5.2 · SKILL.md 数量/字数/题库均以此为准 ⛔不硬编码 · 机检判定=note_validator 常量，见本文件末「驱动口径」·#8真源反转）

| source_type | 判定依据（确定性） | 卡片数（参考·非硬上限） | 精华字数 | 题库 |
|------------|------------------|:-----:|:-------:|:----:|
| `book` | EPUB/PDF 且 >100KB，或你明示"这本书" | 由三明智涌现·无硬上限 | 由内容涌现·无硬上限 | 由三明智涌现·无硬上限（题型：默写/应用/逻辑链） |
| `paper` | 有 abstract/references 结构 | 由三明智涌现·无硬上限 | 由内容涌现·无硬上限 | 由三明智涌现·无硬上限（题型：默写/应用/逻辑链） |
| `article-long` | 纯文本 >8,000 字 | 由三明智涌现·无硬上限 | 由内容涌现·无硬上限 | 由三明智涌现·无硬上限（题型：默写/应用/逻辑链） |
| `article-short` | 纯文本 ≤8,000 字 | 由三明智涌现·无硬上限 | 由内容涌现·无硬上限 | 不出题 |
| `thread` | 推文串/问答串 | 由三明智涌现·无硬上限 | 由内容涌现·无硬上限 | 不出题 |

> 分档立法本意：卡片「拆太碎=注水」由 C3 批判验证判定（每张卡须为独立原子概念+100%原文），**不由数字上限机械封死**。卡片数/精华字数/题库题数均由三明智涌现，无硬上下限；本表「判定依据」列仅作 source_type 识别参考，精华字数/题库**不设数字护栏**，题型结构（默写/应用/逻辑链）为内容维度参考非计数。per-element 微护栏（定位≤30字/核心观点≤100字×3/行动≤50字）与每卡正文≤600字保留为结构护栏。驱动口径：本表=人读视图，机器侧判定=note_validator 常量（_SOURCE_TYPE_SET/CARD_BODY_MAX·#8真源反转），改数两处同步。

### 永久卡片

| 指标 | 阈值 |
|------|------|
| 卡片数 | 由三明智评估涌现（C1枚举→C2归并→C3验证），无数字上限 |
| 每张卡片正文 | ≤600字（含原文依据/AI理解/应用场景三段；2026-08-07 实测校准：原"100-200字"为 v3.x 声明漂移，全池560卡实测基线385-563字，立法本意="一卡一概念一页看完"，500字卡仍一页看完，故校准声明而非迁移存量） |
| ⛔数字上限 | 卡片数不设数字上下限；防注水靠 C3 批判验证（每张卡须为独立原子概念+100%原文），不靠数字护栏 |

### 题库

| 指标 | 阈值 |
|------|------|
| 书 | 题型结构=默写题（检测概念）+ 应用场景题（检测理解）+ 逻辑链推导题（检测深度）；**题数由三明智涌现·无硬上限**（3+3+3 为典型参考，非护栏） |
| 论文/长文 | 题型同上，题数由三明智涌现·无硬上限 |
| 短文/推文串 | 不出题（信息密度不足以支撑有效测试） |

> 落盘（v4.7.0·跨Skill消费边）：题库**必须落盘**为 `{书名}-题库.md`（type:quiz-bank·frontmatter+每题段·含 问题/答案/难度/关联卡片/间隔参数），由 Shall We Talk「阅读复习模式」消费。⛔DO NOT "AI内部维护不单独生成文件"——不落盘=SWT 无物可消费=设计链断裂（朋友实测反馈·2026-08-31）。间隔参数初值 `interval=0; ease=2.5; due=创建日; lapses=0; reps=0`，由 SWT 复习判定后回写（SM-2-lite）。题库 schema 版本=`题库schema v1.0.0`，机检由 `scripts/note_validator.py::validate_quizbank` 兜底。

## 禁止规则

- ⛔ 禁止生成775行旧版11模块笔记（v3.0重构后废除）
- ⛔ 禁止写入 `{{EBOOK_DIR}}/` 下的任何子目录
- ⛔ 禁止使用旧版 reading_status="已读完"（使用四级状态 L1-L4，详见 SKILL.md `reading_status 四级` 表）
- ⛔ 禁止用旧版9模块名（v3.0 重构后废除——旧模板产物见 note-template.md 已废弃标注）
